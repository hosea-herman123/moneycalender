{{define "title"}}Edit Invoice{{end}}

{{define "content"}}
<h1>Edit Invoice</h1>
<p class="subtitle">Change the details and save.</p>

<div class="card">
    <form class="stack" method="POST" action="/invoices/edit">
        <input type="hidden" name="id" value="{{.ID}}">
        <label>Client name</label>
        <input type="text" name="client" value="{{.Client}}" required>
        <label>Amount (KES)</label>
        <input type="number" name="amount" value="{{.Amount}}" min="1" required>
        <label>Issue date</label>
        <input type="date" name="issue_date" value="{{.IssueDate}}" required>
        <label>Due date</label>
        <input type="date" name="due_date" value="{{.DueDate}}" required>
        <div class="actions">
            <button type="submit">Save changes</button>
            <a class="btn secondary" href="/invoices">Cancel</a>
        </div>
    </form>
</div>
{{end}}
